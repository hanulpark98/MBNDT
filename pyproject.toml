[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbndt"
version = "0.1.0"
description = "Multi-Branch Neural Decision Trees with adaptive pruning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Hanul Park"},
  {name = "Jeonghoon Choi"},
  {name = "Juseong Kim"},
  {name = "Sanghun Sel"},
  {name = "Giltae Song"},
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "optuna>=3.5",
  "entmax>=1.3",
  "reinmax>=0.1.0",
  "tqdm>=4.65",
  "category-encoders>=2.6",
  "imbalanced-learn>=0.11",
  "ucimlrepo>=0.0.7",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
gradtree = ["tensorflow>=2.13", "GradTree"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
